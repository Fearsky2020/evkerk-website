name: publish-sermon-2026-09-20

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-sermon-2026-09-20.yml"

permissions:
  contents: read

concurrency:
  group: publish-sermon-2026-09-20
  cancel-in-progress: false

jobs:
  publish:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Download sermon audio
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-66bc-81f4-a750-9ff99be73edc/raw?se=2026-09-25T10%3A48%3A26Z&sp=r&sv=2026-02-06&sr=b&scid=72fa0fdc-3377-5cf0-a169-c433a82a1302&skoid=0a4a0f0c-99ac-4752-9d87-cfac036fa93f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-25T10%3A41%3A53Z&ske=2026-09-26T10%3A41%3A53Z&sks=b&skv=2026-02-06&sig=hO/35Oh8CQGmHeoZ%2BGg8e64ezCuHsnEvlxllY0SGTAo%3D'
          Invoke-WebRequest -Uri $url -OutFile sermon-2026-09-20.mp3
          $size = (Get-Item sermon-2026-09-20.mp3).Length
          if ($size -lt 40000000) { throw "Downloaded audio is unexpectedly small: $size" }
          Write-Host "AUDIO_BYTES=$size"
      - name: Upload audio to R2
        shell: powershell
        run: |
          npx wrangler r2 object put "evkerk-website-media/sermon-direct/2026/20260920-0000-0000-0000-000000000006.mp3" --file sermon-2026-09-20.mp3 --content-type audio/mpeg --remote -y
          if ($LASTEXITCODE -ne 0) { throw "R2 upload failed" }
      - name: Publish sermon metadata
        shell: powershell
        run: |
          $sql = "INSERT INTO sermons (id,sermon_date,title_zh,title_nl,speaker,scripture,summary_zh,summary_nl,youtube_url,audio_url,transcript_url,article_zh,article_nl,status,published_at,updated_at) VALUES ('SERMON-20260920-SP6','2026-09-20','属灵的原则（6）：如何看放手与躺平','','胡松林牧师','','为什么基督徒在面对问题时往往无法解决？这通常是因为他们要么固执己见、不愿放手，要么干脆放弃、“躺平”。我们该如何理解并实践关于“放手”与“躺平”的属灵原则？请收听本主日的讲道信息。愿神祝福大家。','',NULL,'/api/media/sermon-audio/2026/20260920-0000-0000-0000-000000000006.mp3',NULL,'本周信息总结：一、努力抓紧是不信的彰显。凡靠自己的能力努力抓的人，都不相信上帝有丰盛的供应。虽然每个基督徒都相信有神，很多基督徒却不知道人生的供应源头在哪里，还是选择靠自己努力走人生路，走得痛苦不堪、精疲力尽。主耶稣教导我们不要靠自己的能力，要靠主的帮助和供应；只要愿意放下自己，来到主耶稣面前，主就会让人得安息，才会有真正的平安和兴盛。二、顺服倚靠神就有大能彰显。人的本性容易骄傲、喜欢靠自己，也喜欢找人帮助；单靠人的帮助是枉然的，唯独顺服倚靠神，才有真正的平安。三、放手才是真正的负责任。真正的负责任，是凡事交托给主耶稣，也相信祂必定会成就，从内心中放下并等候；躺平则是遇事不祷告、不交托，把事情当作没有发生。我们也要明白，从神来的祝福使我们富足，并不加上忧虑。','','published',datetime('now'),datetime('now')) ON CONFLICT(id) DO UPDATE SET sermon_date=excluded.sermon_date,title_zh=excluded.title_zh,title_nl=excluded.title_nl,speaker=excluded.speaker,scripture=excluded.scripture,summary_zh=excluded.summary_zh,summary_nl=excluded.summary_nl,youtube_url=excluded.youtube_url,audio_url=excluded.audio_url,transcript_url=excluded.transcript_url,article_zh=excluded.article_zh,article_nl=excluded.article_nl,status='published',published_at=datetime('now'),updated_at=datetime('now');"
          npx wrangler d1 execute evkerk-website-db --remote --command $sql
          if ($LASTEXITCODE -ne 0) { throw "D1 publish failed" }
      - name: Verify published row
        shell: powershell
        run: |
          npx wrangler d1 execute evkerk-website-db --remote --command "SELECT id,sermon_date,title_zh,speaker,audio_url,status FROM sermons WHERE id='SERMON-20260920-SP6';"
