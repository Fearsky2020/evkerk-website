name: TAALVIA preview deploy

on:
  push:
    branches:
      - feature/learn-nl-v0.1
    paths:
      - 'public/learn-nl/**'
      - '.github/workflows/taalvia-preview.yml'

permissions:
  contents: read

jobs:
  deploy:
    if: contains(github.event.head_commit.message, '[deploy-taalvia]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Deploy isolated TAALVIA preview
        working-directory: public/learn-nl
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config wrangler.jsonc

      - name: Smoke-test brand homepage, learning app and private exclusions
        shell: bash
        run: |
          set -euo pipefail
          base='https://taalvia-web.emsitao.workers.dev'

          wait_for_marker() {
            local url="$1"
            local marker="$2"
            local output="$3"
            for attempt in {1..12}; do
              code="$(curl -sS -o "$output" -w '%{http_code}' "$url" || true)"
              if [ "$code" = '200' ] && grep -q "$marker" "$output"; then
                echo "OK: $url contains $marker"
                return 0
              fi
              echo "Waiting for route propagation: $url (attempt $attempt, HTTP $code)"
              sleep 3
            done
            echo "Timed out waiting for $url to contain: $marker"
            echo '--- response preview ---'
            head -c 500 "$output" || true
            exit 1
          }

          wait_for_marker "$base/" '轻松学荷兰语' /tmp/taalvia-home.html
          grep -q 'TAALVIA' /tmp/taalvia-home.html
          wait_for_marker "$base/home.css?v=1" 'hero-visual' /tmp/taalvia-home.css
          wait_for_marker "$base/learn/" 'portable.js' /tmp/taalvia-learn.html
          wait_for_marker "$base/learn/manifest.webmanifest" 'TAALVIA' /tmp/taalvia-manifest.json

          for hidden_path in 'BRAND-BRIEF.md' '.wrangler/cache/wrangler-account.json' 'wrangler.jsonc' 'router.js'; do
            code="$(curl -sS -o /dev/null -w '%{http_code}' "$base/$hidden_path")"
            echo "$hidden_path -> HTTP $code"
            if [ "$code" != '404' ]; then
              echo "Unexpected public asset: $hidden_path returned HTTP $code"
              exit 1
            fi
          done
