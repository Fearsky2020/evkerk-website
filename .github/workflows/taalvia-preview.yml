name: TAALVIA preview deploy

on:
  push:
    branches:
      - feature/learn-nl-v0.1
    paths:
      - 'public/learn-nl/**'
      - '.github/workflows/taalvia-preview.yml'

permissions:
  contents: read

jobs:
  deploy:
    if: contains(github.event.head_commit.message, '[deploy-taalvia]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Deploy isolated TAALVIA preview
        working-directory: public/learn-nl
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config wrangler.jsonc
