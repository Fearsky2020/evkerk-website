name: TAALVIA preview deploy

on:
  push:
    branches:
      - feature/learn-nl-v0.1
    paths:
      - 'public/learn-nl/**'
      - '.github/workflows/taalvia-preview.yml'

permissions:
  contents: read

jobs:
  deploy:
    if: contains(github.event.head_commit.message, '[deploy-taalvia]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Deploy isolated TAALVIA preview
        working-directory: public/learn-nl
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config wrangler.jsonc

      - name: Smoke-test public preview and private exclusions
        shell: bash
        run: |
          set -euo pipefail
          base='https://taalvia-web.emsitao.workers.dev'
          for attempt in 1 2 3 4 5; do
            if curl -fsS "$base/" -o /tmp/taalvia-index.html; then
              break
            fi
            sleep 3
          done
          grep -q 'host-brand.js' /tmp/taalvia-index.html
          curl -fsS "$base/manifest.webmanifest" -o /tmp/taalvia-manifest.json
          grep -q 'TAALVIA' /tmp/taalvia-manifest.json
          for hidden_path in 'BRAND-BRIEF.md' '.wrangler/cache/wrangler-account.json' 'wrangler.jsonc'; do
            code="$(curl -sS -o /dev/null -w '%{http_code}' "$base/$hidden_path")"
            if [ "$code" != '404' ]; then
              echo "Unexpected public asset: $hidden_path returned HTTP $code"
              exit 1
            fi
          done
