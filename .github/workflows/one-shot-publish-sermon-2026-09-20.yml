name: one-shot-publish-sermon-2026-09-20
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-shot-publish-sermon-2026-09-20.yml"

permissions:
  contents: read

jobs:
  publish:
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Publish sermon audio and metadata
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function B([string]$s){[Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($s))}
          function Q([string]$s){ "'" + $s.Replace("'","''") + "'" }

          $audioUrl = 'https://sdmntpreastus2.oaiusercontent.com/files/00000000-34f4-81f6-8a58-51d910f2bba7/raw?se=2026-09-25T12%3A35%3A11Z&sp=r&sv=2026-02-06&sr=b&scid=4970a37f-ec57-5a84-996c-33d1001b1f50&skoid=0a4a0f0c-99ac-4752-9d87-cfac036fa93f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-25T11%3A44%3A00Z&ske=2026-09-26T11%3A44%3A00Z&sks=b&skv=2026-02-06&sig=elz09qqSawD9PcnkMPdsOyYfU4AKaE4jcz6Pqj2nucQ%3D'
          $audio = Join-Path $env:RUNNER_TEMP 'sermon-2026-09-20.mp3'
          Invoke-WebRequest -UseBasicParsing -Uri $audioUrl -OutFile $audio

          $key = 'sermon-direct/2026/sermon-2026-09-20.mp3'
          $public = '/api/media/sermon-audio/2026/sermon-2026-09-20.mp3'
          npx wrangler r2 object put "evkerk-website-media/$key" --file $audio --content-type audio/mpeg --remote
          if($LASTEXITCODE -ne 0){ throw "R2_FAIL_$LASTEXITCODE" }

          $sid = 'sermon-2026-09-20'
          $date = '2026-09-20'
          $title = B '44CK5bGe54G155qE5Y6f5YiZ44CL77yINu+8ie+8muWmguS9leeci+aUvuaJi+S4jui6uuW5sw=='
          $speaker = B '6IOh54mn5biI'
          $summary = B ''
          $sql = "INSERT INTO sermons (id,sermon_date,title_zh,title_nl,speaker,scripture,summary_zh,summary_nl,youtube_url,audio_url,transcript_url,article_zh,article_nl,status,published_at,updated_at) VALUES ("+(Q $sid)+","+(Q $date)+","+(Q $title)+",'',"+(Q $speaker)+",'',"+(Q $summary)+",'','',"+(Q $public)+",'','','','published',datetime('now'),datetime('now')) ON CONFLICT(id) DO UPDATE SET sermon_date=excluded.sermon_date,title_zh=excluded.title_zh,speaker=excluded.speaker,summary_zh=excluded.summary_zh,audio_url=excluded.audio_url,status='published',published_at=datetime('now'),updated_at=datetime('now');"
          npx wrangler d1 execute evkerk-website-db --remote --command $sql
          if($LASTEXITCODE -ne 0){ throw "D1_FAIL_$LASTEXITCODE" }

          $api = Invoke-RestMethod 'https://evkerk.nl/api/sermons'
          $row = @($api.sermons) | Where-Object { $_.id -eq $sid }
          if(-not $row){ throw 'VERIFY_NOT_FOUND' }
          if($row.audio_url -ne $public){ throw 'VERIFY_AUDIO_MISMATCH' }
          if($row.speaker -ne $speaker){ throw 'VERIFY_SPEAKER_MISMATCH' }
          Write-Host 'EVKERK_SERMON_UPLOAD=PASS'
          Write-Host "SERMON_ID=$sid"
          Write-Host "AUDIO_URL=$public"
