name: one-shot-publish-sermon-2026-09-20
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-shot-publish-sermon-2026-09-20.yml"

permissions:
  contents: read

jobs:
  publish:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Publish sermon audio and metadata
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function B([string]$s){[Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($s))}
          function Q([string]$s){ "'" + $s.Replace("'","''") + "'" }

          $audioUrl = 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-2990-81f4-8ccb-d41f6dcffb74/raw?se=2026-09-25T10%3A42%3A04Z&sp=r&sv=2026-02-06&sr=b&scid=b043f3f9-cf26-5fb7-aedc-65c75adeaa28&skoid=0a4a0f0c-99ac-4752-9d87-cfac036fa93f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-25T10%3A25%3A25Z&ske=2026-09-26T10%3A25%3A25Z&sks=b&skv=2026-02-06&sig=UoEXHMjnAoT%2BpWeNcroGZ4Bk9MqIwazkkZ4QIsaDq7k%3D'
          $audio = Join-Path $env:RUNNER_TEMP 'sermon-2026-09-20.mp3'
          Invoke-WebRequest -UseBasicParsing -Uri $audioUrl -OutFile $audio

          $rid = [guid]::NewGuid().ToString()
          $key = "sermon-direct/2026/$rid.mp3"
          $public = "/api/media/sermon-audio/2026/$rid.mp3"
          npx wrangler r2 object put "evkerk-website-media/$key" --file $audio --content-type audio/mpeg --remote
          if($LASTEXITCODE -ne 0){ throw "R2_FAIL_$LASTEXITCODE" }

          $sid = [guid]::NewGuid().ToString()
          $date = '2026-09-20'
          $title = B '44CK5bGe54G155qE5Y6f5YiZ44CL77yINu+8ie+8muWmguS9leeci+aUvuaJi+S4jui6uuW5sw=='
          $speaker = B '6IOh54mn5biI'
          $summary = B ''
          $sql = "INSERT INTO sermons (id,sermon_date,title_zh,title_nl,speaker,scripture,summary_zh,summary_nl,youtube_url,audio_url,transcript_url,article_zh,article_nl,status,published_at,updated_at) VALUES ("+(Q $sid)+","+(Q $date)+","+(Q $title)+",'',"+(Q $speaker)+",'',"+(Q $summary)+",'','',"+(Q $public)+",'','','','published',datetime('now'),datetime('now'));"
          npx wrangler d1 execute evkerk-website-db --remote --command $sql
          if($LASTEXITCODE -ne 0){ throw "D1_FAIL_$LASTEXITCODE" }

          $api = Invoke-RestMethod 'https://evkerk.nl/api/sermons'
          $row = @($api.sermons) | Where-Object { $_.id -eq $sid }
          if(-not $row){ throw 'VERIFY_NOT_FOUND' }
          if($row.audio_url -ne $public){ throw 'VERIFY_AUDIO_MISMATCH' }
          Write-Host 'EVKERK_SERMON_UPLOAD=PASS'
          Write-Host "SERMON_ID=$sid"
          Write-Host "AUDIO_URL=$public"
