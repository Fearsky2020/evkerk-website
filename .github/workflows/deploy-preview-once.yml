name: deploy-evkerk

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evkerk-production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [self-hosted, Windows, X64, evkerk]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run release checks
        run: npm run check

      - name: Run test suite
        run: npm test

      - name: Deploy EVKERK Worker
        run: npx wrangler deploy
