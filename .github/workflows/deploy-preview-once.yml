name: deploy-evkerk

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: evkerk-production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [self-hosted, Windows, X64, evkerk]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Run release checks
        run: npm run check

      - name: Deploy EVKERK Worker
        run: npx wrangler deploy
