name: sunday-school-d1-preflight

on:
  push:
    branches: [feat/sunday-school-teacher-hub]
    paths:
      - ".github/workflows/sunday-school-d1-preflight.yml"

permissions:
  contents: read

concurrency:
  group: evkerk-sunday-school-d1-preflight
  cancel-in-progress: true

jobs:
  inspect:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: Inspect Sunday school tables
        shell: powershell
        run: |
          npx wrangler d1 execute evkerk-website-db --remote --command "SELECT name FROM sqlite_schema WHERE type='table' AND name LIKE 'sunday_school_%' ORDER BY name;"
      - name: Inspect lesson columns
        shell: powershell
        run: |
          npx wrangler d1 execute evkerk-website-db --remote --command "PRAGMA table_info(sunday_school_lessons);"
