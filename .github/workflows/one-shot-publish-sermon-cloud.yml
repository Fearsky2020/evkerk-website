name: one-shot-publish-sermon-cloud
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-shot-publish-sermon-cloud.yml"

permissions:
  contents: read
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Download staged sermon audio
        uses: actions/download-artifact@v4
        with:
          name: sermon-2026-09-20-audio
          path: staged-audio
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 36135540426
      - name: Publish sermon to EVKERK
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "CLOUDFLARE_API_TOKEN_MISSING"
            exit 2
          fi
          test -f staged-audio/sermon-2026-09-20.mp3
          test "$(stat -c%s staged-audio/sermon-2026-09-20.mp3)" -gt 40000000

          npx wrangler r2 object put "evkerk-website-media/sermon-direct/2026/sermon-2026-09-20.mp3"             --file staged-audio/sermon-2026-09-20.mp3 --content-type audio/mpeg --remote

          python - <<'PY'
          import base64
          title='《属灵的原则》（6）：如何看放手与躺平'
          speaker='胡牧师'
          summary='为什么基督徒在面对问题时往往无法解决？这通常是因为他们要么固执己见、不愿放手，要么干脆放弃、“躺平”。我们该如何理解并实践关于“放手”与“躺平”的属灵原则？请收听本主日的讲道信息。愿神祝福大家。'
          def q(s): return "'" + s.replace("'","''") + "'"
          sql=f"""INSERT INTO sermons
          (id,sermon_date,title_zh,title_nl,speaker,scripture,summary_zh,summary_nl,youtube_url,audio_url,transcript_url,article_zh,article_nl,status,published_at,updated_at)
          VALUES ({q('sermon-2026-09-20')},{q('2026-09-20')},{q(title)},'',{q(speaker)},'',{q(summary)},'','',{q('/api/media/sermon-audio/2026/sermon-2026-09-20.mp3')},'','','','published',datetime('now'),datetime('now'))
          ON CONFLICT(id) DO UPDATE SET
          sermon_date=excluded.sermon_date,title_zh=excluded.title_zh,speaker=excluded.speaker,
          summary_zh=excluded.summary_zh,audio_url=excluded.audio_url,status='published',
          published_at=datetime('now'),updated_at=datetime('now');"""
          open('sermon.sql','w',encoding='utf-8').write(sql)
          PY

          npx wrangler d1 execute evkerk-website-db --remote --file sermon.sql
          echo "EVKERK_SERMON_UPLOAD=PASS"
