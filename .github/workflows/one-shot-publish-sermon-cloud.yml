name: one-shot-publish-sermon-cloud
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-shot-publish-sermon-cloud.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Release checks
        run: npm run check
      - name: Deploy EVKERK Worker
        run: npx wrangler deploy
      - name: Verify sermon is live
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..12}; do
            if python - <<'PY'
          import json, urllib.request, sys
          try:
              with urllib.request.urlopen('https://evkerk.nl/api/sermons', timeout=20) as r:
                  d=json.load(r)
              rows=[x for x in d.get('sermons',[]) if x.get('id')=='sermon-2026-09-20']
              if len(rows)!=1: raise SystemExit(1)
              row=rows[0]
              assert row.get('speaker')=='胡牧师'
              assert row.get('title_zh')=='《属灵的原则》（6）：如何看放手与躺平'
              assert 'sermon-media-2026-09-20' in str(row.get('audio_url',''))
              print('EVKERK_SERMON_UPLOAD=PASS')
              print(json.dumps(row,ensure_ascii=False))
          except Exception:
              raise SystemExit(1)
          PY
            then exit 0; fi
            sleep 5
          done
          exit 1
