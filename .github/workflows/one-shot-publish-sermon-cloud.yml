name: one-shot-publish-sermon-cloud
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-shot-publish-sermon-cloud.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Release checks
        run: npm run check
      - name: Deploy EVKERK Worker
        run: npx wrangler deploy
      - name: Verify sermon is live
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, urllib.request, time
          url='https://evkerk.nl/api/sermons?bust=202609251452'
          with urllib.request.urlopen(url, timeout=30) as r:
              d=json.load(r)
          print(json.dumps(d,ensure_ascii=False))
          rows=[x for x in d.get('sermons',[]) if x.get('id')=='sermon-2026-09-20']
          print('MATCHES='+json.dumps(rows,ensure_ascii=False))
          if len(rows)!=1: raise SystemExit('VERIFY_NOT_FOUND')
          row=rows[0]
          if row.get('speaker')!='胡牧师': raise SystemExit('VERIFY_SPEAKER')
          if row.get('title_zh')!='《属灵的原则》（6）：如何看放手与躺平': raise SystemExit('VERIFY_TITLE')
          if 'sermon-media-2026-09-20' not in str(row.get('audio_url','')): raise SystemExit('VERIFY_AUDIO_URL')
          print('EVKERK_SERMON_UPLOAD=PASS')
          PY
