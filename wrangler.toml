name = "evkerk-website-preview"
main = "src/worker.js"
compatibility_date = "2026-09-01"
keep_vars = true
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[triggers]
crons = ["*/30 * * * *"]

[vars]
SITE_TIMEZONE = "Europe/Amsterdam"
MAX_MEDIA_MB = "95"

[[d1_databases]]
binding = "DB"
database_name = "evkerk-website-db"
database_id = "2817f829-f9d3-4426-b35c-f8eb21b6b934"
