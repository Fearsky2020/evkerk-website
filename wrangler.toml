name = "evkerk-website-preview"
account_id = "294714bd4468cf9ece4f2ef6f2fed9d5"
main = "src/worker-chatkit.js"
compatibility_date = "2026-09-01"
keep_vars = true
workers_dev = true
routes = [
  { pattern = "evkerk.nl", custom_domain = true },
  { pattern = "www.evkerk.nl", custom_domain = true },
  { pattern = "evkerk.com", custom_domain = true },
  { pattern = "www.evkerk.com", custom_domain = true }
]

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "404-page"
run_worker_first = [
  "/", "/index.html",
  "/activities", "/activities.html",
  "/bible", "/bible.html",
  "/privacy", "/privacy.html",
  "/sermon", "/sermon.html",
  "/sermons", "/sermons.html",
  "/api/*", "/admin", "/admin/*", "/team", "/team/*"
]

[ai]
binding = "AI"

[triggers]
crons = ["*/30 * * * *"]

[vars]
SITE_TIMEZONE = "Europe/Amsterdam"
MAX_MEDIA_MB = "95"
TURNSTILE_SITE_KEY = "0x4AAAAAAFEUlgxzLOR-z5yA"

[[d1_databases]]
binding = "DB"
database_name = "evkerk-website-db"
database_id = "2817f829-f9d3-4426-b35c-f8eb21b6b934"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "evkerk-website-media"

[[send_email]]
name = "PASSWORD_RESET_EMAIL"
