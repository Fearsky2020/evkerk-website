<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6f2ea">
  <title>近期活动 | 基督教福音教会 Evangeliekerk</title>
  <meta name="description" content="基督教福音教会近期活动、团契与咖啡会友小组照片。">
  <link rel="icon" href="/assets/evkerk-logo.webp" type="image/webp"><link rel="stylesheet" href="/styles.css?v=1"><link rel="stylesheet" href="/brand.css?v=24">
  <style>
    .archive-hero{padding-top:68px;padding-bottom:42px}.archive-hero h1{max-width:780px;margin:10px 0 16px;font-size:clamp(46px,7vw,78px);line-height:1.02;letter-spacing:-.05em}.archive-hero>p:last-child{max-width:700px;color:var(--muted);font-size:18px;line-height:1.75}
    .activity-archive{padding-top:10px;padding-bottom:90px}.album-list{display:grid;gap:28px}.album{padding:24px;border:1px solid var(--line);border-radius:26px;background:var(--paper);box-shadow:0 16px 38px rgba(8,127,174,.07)}.album-head{display:flex;justify-content:space-between;gap:24px;align-items:end;margin-bottom:18px}.album-head h2{margin:8px 0 0;font-size:clamp(25px,3vw,36px)}.album-category{color:var(--brand-blue-deep);font-size:12px;font-weight:900;letter-spacing:.12em}.album-meta{color:var(--muted);font-size:14px;text-align:right}.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.photo-grid button{padding:0;border:0;border-radius:16px;overflow:hidden;background:var(--brand-blue-soft);cursor:zoom-in}.photo-grid img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;transition:transform .25s ease}.photo-grid button:hover img{transform:scale(1.025)}.archive-empty{padding:38px;border:1px solid var(--line);border-radius:22px;background:var(--paper);text-align:center;color:var(--muted)}.header-page-actions{display:flex;align-items:center;gap:9px}.home-link{padding:11px 15px;border-radius:999px;background:var(--brand-blue-deep);color:#fff;text-decoration:none;font-size:14px;font-weight:850}
    dialog{width:min(1100px,calc(100% - 24px));border:0;padding:0;background:transparent}dialog::backdrop{background:rgba(0,15,24,.86)}.lightbox{position:relative}.lightbox img{display:block;max-width:100%;max-height:86vh;margin:auto;border-radius:18px}.lightbox button{position:absolute;right:12px;top:12px;width:42px;height:42px;border:0;border-radius:50%;background:rgba(6,19,28,.82);color:#fff;font-size:25px;cursor:pointer}
    html[data-theme="dark"] .album-category{color:#72d4f5}@media(max-width:760px){.archive-hero{padding-top:42px}.photo-grid{grid-template-columns:repeat(2,1fr)}.album{padding:16px}.album-head{display:block}.album-meta{text-align:left;margin-top:8px}.home-link{display:none}}@media(max-width:430px){.photo-grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <header class="site-header"><a class="brand" href="/" aria-label="Evangeliekerk home"><img class="brand-mark" src="/assets/evkerk-logo.webp" alt="" width="40" height="40"><span class="brand-copy"><strong id="brandName">基督教福音教会</strong><small id="brandSubtitle">EVANGELIEKERK</small></span></a><div class="header-page-actions"><button class="round-btn" id="themeToggle" type="button">☾</button><button class="lang-btn" id="langToggle" type="button">NL</button><a class="home-link" href="/" id="homeLink">返回首页</a></div></header>
  <main><section class="archive-hero shell"><p class="eyebrow">RECENT LIFE</p><h1 id="pageTitle">一起经历的故事。</h1><p id="pageIntro">这里收录教会活动、团契活动和咖啡会友小组的照片。新的活动会从后台自动加入。</p></section><section class="activity-archive shell"><div class="album-list" id="albumList"><div class="archive-empty">正在加载活动…</div></div></section></main>
  <dialog id="photoDialog"><div class="lightbox"><img id="largePhoto" alt=""><button type="button" id="closePhoto" aria-label="关闭">×</button></div></dialog>
  <footer class="site-footer shell"><div class="footer-brand"><img src="/assets/evkerk-logo.webp" alt="" width="34" height="34"><span><strong>基督教福音教会</strong><small>EVANGELIEKERK</small></span></div><small>© 2026 Evangeliekerk</small></footer>
  <script src="/activities.js?v=2"></script>
</body></html>
