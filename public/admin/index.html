<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>EVKERK 内容后台</title>
  <style>
    :root{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;--bg:#f4f1eb;--paper:#fff;--ink:#20231f;--muted:#6d716a;--line:#ddd7ce;--dark:#163746;--ok:#24744a;--blue:#11abe3;--blue-deep:#087fae;--blue-soft:#eaf8fd;--blue-line:#bfe9f8}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#eef9fd 0,#f7f4ee 280px,var(--bg) 100%);color:var(--ink)}.shell{width:min(900px,calc(100% - 24px));margin:0 auto;padding:24px 0 80px}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:20px}.top h1{font-size:24px;margin:0}.admin-brand{display:flex;align-items:center;gap:12px}.admin-brand img{width:46px;height:46px;flex:0 0 auto}.admin-brand .hint{margin-top:4px}.top a{color:inherit}.status{padding:12px 14px;border:1px solid var(--blue-line);border-radius:12px;background:var(--blue-soft);color:var(--muted);font-size:13px}.tabs{display:flex;gap:8px;overflow:auto;margin:20px 0}.tabs button{border:1px solid var(--line);background:var(--paper);padding:10px 14px;border-radius:999px;white-space:nowrap;font-weight:750}.tabs button.active{background:var(--blue-deep);color:#fff;border-color:var(--blue-deep);box-shadow:0 6px 18px rgba(8,127,174,.18)}.panel{display:none}.panel.active{display:block}.card{background:rgba(255,255,255,.94);border:1px solid #d7e5e9;border-radius:18px;padding:20px;margin-bottom:16px}.card h2{margin:0 0 16px;font-size:20px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.full{grid-column:1/-1}label{display:grid;gap:6px;font-size:13px;font-weight:750}input,textarea,select{width:100%;border:1px solid #cedde2;background:#fff;color:var(--ink);border-radius:10px;padding:12px;font:inherit;font-size:16px}input:focus,textarea:focus,select:focus{outline:3px solid rgba(17,171,227,.16);border-color:var(--blue)}textarea{resize:vertical;min-height:110px}.actions{display:flex;gap:10px;align-items:center;margin-top:16px;flex-wrap:wrap}.btn{border:0;border-radius:10px;padding:12px 16px;background:var(--blue-deep);color:#fff;font-weight:850;cursor:pointer}.btn.secondary{background:#fff;color:var(--ink);border:1px solid var(--line)}.btn.danger{background:#fff;color:#8c302d;border:1px solid #e0b9b6}.msg{font-size:13px;color:var(--muted)}.token{display:flex;gap:8px}.token input{flex:1}.hint{font-size:12px;color:var(--muted);line-height:1.55}.ok{color:var(--ok)}.photo-list{display:grid;gap:12px}.photo-item{display:grid;grid-template-columns:150px 1fr auto;gap:16px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:14px}.photo-item img{width:150px;height:96px;border-radius:10px;object-fit:cover}.photo-item h3{margin:0 0 6px;font-size:16px}.photo-item p{margin:0;color:var(--muted);font-size:13px;line-height:1.5}.photo-actions{display:flex;gap:8px;flex-wrap:wrap}.upload-note{padding:10px 12px;border-radius:10px;background:var(--blue-soft);color:#17617e;border:1px solid var(--blue-line);font-size:13px}dialog{width:min(620px,calc(100% - 24px));border:0;border-radius:18px;padding:0;background:var(--paper);color:var(--ink);box-shadow:0 24px 80px rgba(0,0,0,.28)}dialog::backdrop{background:rgba(20,22,19,.58)}.dialog-card{padding:22px}.dialog-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px}.dialog-head h2{margin:0;font-size:21px}.icon-btn{border:0;background:transparent;font-size:24px;line-height:1;cursor:pointer;color:var(--muted)}@media(max-width:640px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.top{align-items:flex-start;flex-direction:column}.token{flex-direction:column}.photo-item{grid-template-columns:96px 1fr}.photo-item img{width:96px;height:76px}.photo-item .photo-actions{grid-column:1/-1}}
  </style>
</head>
<body>
  <main class="shell">
    <div class="top"><div class="admin-brand"><img src="/assets/evkerk-logo.webp" alt="福音教会 Logo"><div><h1>EVKERK 内容后台</h1><div class="hint">照片、公告与讲道管理</div></div></div><a href="/">返回官网</a></div>
    <div class="card">
      <label>后台 Token</label>
      <div class="token"><input id="token" type="password" autocomplete="current-password" placeholder="INGEST_TOKEN / SYNC_TOKEN"><button class="btn secondary" id="saveToken">记住</button></div>
      <p class="hint">保存在本机浏览器，不上传到页面源码。正式上线后会再加 Cloudflare Access。</p>
    </div>
    <div class="status" id="health">正在检查后端状态…</div>

    <div class="tabs">
      <button class="active" data-tab="activities">活动照片</button>
      <button data-tab="announcement">发布公告</button>
      <button data-tab="sermon">补充讲道</button>
      <button data-tab="sync">日历同步</button>
    </div>

    <section class="panel active" id="activities">
      <form class="card" id="activityForm">
        <h2>上传活动照片</h2>
        <p class="upload-note">可以一次选择多张照片；它们会使用同一组活动名称、类别、日期和地点，逐张发布到官网轮播。</p>
        <div class="grid">
          <label class="full">照片（可多选；每张最大 12MB）<input name="image" type="file" accept="image/jpeg,image/png,image/webp,image/avif" multiple required></label>
          <label>属于哪一类<select name="category" required><option value="church">教会活动</option><option value="fellowship">团契活动</option><option value="small_group">小组活动</option></select></label>
          <label>日期<input name="event_date" type="date"></label>
          <label>中文活动名称<input name="title_zh" required placeholder="例如：教会夏日烧烤"></label>
          <label>荷兰文名称（可以不填）<input name="title_nl"></label>
          <label class="full">地点<input name="location" placeholder="例如：Zuiderpark, Den Haag"></label>
        </div>
        <div class="actions"><button class="btn" type="submit">发布到官网</button><span class="msg" id="activityMsg"></span></div>
      </form>
      <div class="card"><h2>管理已经发布的照片</h2><p class="hint">“编辑”可修改名称、类别、日期和地点；“下架”会把照片从官网轮播移除。</p><div class="photo-list" id="activityList"><p class="hint">保存后台密码后会显示。</p></div></div>
    </section>

    <section class="panel" id="announcement">
      <form class="card" id="announcementForm">
        <h2>公告</h2>
        <div class="grid">
          <label>中文标题<input name="title_zh" required></label>
          <label>荷兰文标题<input name="title_nl"></label>
          <label class="full">中文内容<textarea name="body_zh" required></textarea></label>
          <label class="full">荷兰文内容<textarea name="body_nl"></textarea></label>
          <label>开始时间<input name="starts_at" type="datetime-local"></label>
          <label>结束时间<input name="ends_at" type="datetime-local"></label>
          <label>优先级<select name="priority"><option value="0">普通</option><option value="10">重要</option><option value="20">置顶</option></select></label>
          <label>状态<select name="status"><option value="published">立即发布</option><option value="draft">草稿</option></select></label>
        </div>
        <div class="actions"><button class="btn" type="submit">保存公告</button><span class="msg" id="announcementMsg"></span></div>
      </form>
    </section>

    <section class="panel" id="sermon">
      <form class="card" id="sermonForm">
        <h2>讲道</h2>
        <div class="grid">
          <label>日期<input name="sermon_date" type="date" required></label>
          <label>讲员<input name="speaker"></label>
          <label>中文标题<input name="title_zh" required></label>
          <label>荷兰文标题<input name="title_nl"></label>
          <label class="full">经文<input name="scripture"></label>
          <label class="full">中文摘要<textarea name="summary_zh"></textarea></label>
          <label class="full">荷兰文摘要<textarea name="summary_nl"></textarea></label>
          <label>YouTube<input name="youtube_url" type="url"></label>
          <label>音频<input name="audio_url" type="url"></label>
          <label class="full">文字稿<input name="transcript_url" type="url"></label>
          <label>状态<select name="status"><option value="published">发布</option><option value="draft">草稿</option></select></label>
        </div>
        <div class="actions"><button class="btn" type="submit">保存讲道</button><span class="msg" id="sermonMsg"></span></div>
      </form>
    </section>

    <section class="panel" id="sync">
      <div class="card">
        <h2>Google Calendar</h2>
        <p class="hint">正常情况下 Cloudflare 每 30 分钟自动同步一次。只有临时改时间、刚加活动又想马上看到时，才需要点这里。</p>
        <div class="actions"><button class="btn" id="syncNow" type="button">立即同步</button><span class="msg" id="syncMsg"></span></div>
      </div>
    </section>
  </main>

  <dialog id="activityEditDialog">
    <form class="dialog-card" id="activityEditForm">
      <div class="dialog-head"><h2>编辑活动照片</h2><button class="icon-btn" id="closeActivityEdit" type="button" aria-label="关闭">×</button></div>
      <input name="id" type="hidden">
      <div class="grid">
        <label>中文活动名称<input name="title_zh" required></label>
        <label>荷兰文名称（可以不填）<input name="title_nl"></label>
        <label>属于哪一类<select name="category" required><option value="church">教会活动</option><option value="fellowship">团契活动</option><option value="small_group">小组活动</option></select></label>
        <label>日期<input name="event_date" type="date"></label>
        <label class="full">地点<input name="location"></label>
      </div>
      <div class="actions"><button class="btn" type="submit">保存修改</button><button class="btn secondary" id="cancelActivityEdit" type="button">取消</button><span class="msg" id="activityEditMsg"></span></div>
    </form>
  </dialog>
  <script>
    (()=>{
      const token=document.getElementById('token');
      token.value=localStorage.getItem('evkerk-admin-token')||'';
      document.getElementById('saveToken').onclick=()=>{localStorage.setItem('evkerk-admin-token',token.value.trim());document.getElementById('health').textContent='后台密码已保存在这台设备。';loadActivities()};
      document.querySelectorAll('[data-tab]').forEach(btn=>btn.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(b=>b.classList.remove('active'));document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));btn.classList.add('active');document.getElementById(btn.dataset.tab).classList.add('active')});
      const auth=()=>({'Authorization':`Bearer ${token.value.trim()}`,'Content-Type':'application/json','Accept':'application/json'});
      async function post(url,data){const r=await fetch(url,{method:'POST',headers:auth(),body:JSON.stringify(data||{})});const body=await r.json().catch(()=>({}));if(!r.ok||body.ok===false)throw new Error(body.error||`HTTP ${r.status}`);return body}
      function data(form){const out=Object.fromEntries(new FormData(form));for(const k of Object.keys(out))if(out[k]==='')delete out[k];return out}
      function esc(value){const node=document.createElement('span');node.textContent=String(value||'');return node.innerHTML}
      const categoryName={church:'教会活动',fellowship:'团契活动',small_group:'小组活动'};
      const editDialog=document.getElementById('activityEditDialog');
      const editForm=document.getElementById('activityEditForm');
      const closeEdit=()=>editDialog.close();
      document.getElementById('closeActivityEdit').onclick=closeEdit;
      document.getElementById('cancelActivityEdit').onclick=closeEdit;
      editForm.onsubmit=async e=>{e.preventDefault();const msg=document.getElementById('activityEditMsg');const button=editForm.querySelector('button[type="submit"]');button.disabled=true;msg.textContent='保存中…';try{const values=data(editForm);const id=values.id;delete values.id;await post(`/api/admin/activities/${encodeURIComponent(id)}/update`,values);msg.textContent='已保存';msg.className='msg ok';await loadActivities();closeEdit()}catch(err){msg.textContent=err.message;msg.className='msg'}finally{button.disabled=false}};
      async function loadActivities(){const list=document.getElementById('activityList');if(!token.value.trim()){list.innerHTML='<p class="hint">请先填写并保存后台密码。</p>';return}try{const r=await fetch('/api/admin/activities',{headers:{Authorization:`Bearer ${token.value.trim()}`,Accept:'application/json'}});const body=await r.json();if(!r.ok)throw new Error(body.error||`HTTP ${r.status}`);const items=(body.activities||[]).filter(item=>item.status==='published');list.innerHTML=items.length?items.map(item=>`<article class="photo-item"><img src="${esc(item.image_url)}" alt=""><div><h3>${esc(item.title_zh)}</h3><p>${esc(categoryName[item.category]||item.category)}${item.event_date?' · '+esc(item.event_date):''}${item.location?' · '+esc(item.location):''}</p></div><div class="photo-actions"><button class="btn secondary" type="button" data-edit="${esc(item.id)}">编辑</button><button class="btn danger" type="button" data-hide="${esc(item.id)}">下架</button></div></article>`).join(''):'<p class="hint">还没有上传活动照片。</p>';const byId=new Map(items.map(item=>[item.id,item]));list.querySelectorAll('[data-edit]').forEach(btn=>btn.onclick=()=>{const item=byId.get(btn.dataset.edit);['id','title_zh','title_nl','category','event_date','location'].forEach(name=>{editForm.elements[name].value=item[name]||''});document.getElementById('activityEditMsg').textContent='';editDialog.showModal()});list.querySelectorAll('[data-hide]').forEach(btn=>btn.onclick=async()=>{if(!confirm('确定从官网下架这张照片吗？'))return;btn.disabled=true;try{await post(`/api/admin/activities/${encodeURIComponent(btn.dataset.hide)}/hide`,{});await loadActivities()}catch(err){alert(err.message);btn.disabled=false}})}catch(err){list.innerHTML=`<p class="hint">${esc(err.message)}</p>`}}
      document.getElementById('activityForm').onsubmit=async e=>{e.preventDefault();const formEl=e.currentTarget;const msg=document.getElementById('activityMsg');const button=formEl.querySelector('button[type="submit"]');const files=[...formEl.elements.image.files];if(!files.length){msg.textContent='请选择照片';return}button.disabled=true;let uploaded=0;try{for(const file of files){msg.textContent=`正在上传 ${uploaded+1}/${files.length}…`;const form=new FormData();form.append('image',file);['category','event_date','title_zh','title_nl','location'].forEach(name=>form.append(name,formEl.elements[name].value));const r=await fetch('/api/admin/activities',{method:'POST',headers:{Authorization:`Bearer ${token.value.trim()}`},body:form});const body=await r.json().catch(()=>({}));if(!r.ok||body.ok===false)throw new Error(body.error||`HTTP ${r.status}`);uploaded+=1}msg.textContent=`已发布 ${uploaded} 张照片`;msg.className='msg ok';formEl.reset();await loadActivities()}catch(err){msg.textContent=`已发布 ${uploaded} 张；随后失败：${err.message}`;msg.className='msg'}finally{button.disabled=false}};
      document.getElementById('announcementForm').onsubmit=async e=>{e.preventDefault();const formEl=e.currentTarget;const msg=document.getElementById('announcementMsg');msg.textContent='保存中…';try{await post('/api/ingest/announcement',data(formEl));msg.textContent='已保存';msg.className='msg ok';formEl.reset()}catch(err){msg.textContent=err.message;msg.className='msg'}};
      document.getElementById('sermonForm').onsubmit=async e=>{e.preventDefault();const formEl=e.currentTarget;const msg=document.getElementById('sermonMsg');msg.textContent='保存中…';try{await post('/api/ingest/sermon',data(formEl));msg.textContent='已保存';msg.className='msg ok';formEl.reset()}catch(err){msg.textContent=err.message;msg.className='msg'}};
      document.getElementById('syncNow').onclick=async()=>{const msg=document.getElementById('syncMsg');msg.textContent='同步中…';try{const body=await post('/api/sync/calendar',{});msg.textContent=body.skipped?`未执行：${body.reason}`:`完成：${body.synced||0} 个事件`;msg.className='msg ok'}catch(err){msg.textContent=err.message;msg.className='msg'}};
      fetch('/api/health').then(r=>r.json()).then(b=>{document.getElementById('health').textContent=`后端：${b.ok?'正常':'异常'} · 数据库：${b.db?'已连接':'待连接'} · 图片存储：${b.media?'已连接':'待连接'} · 日历：${b.calendar?'已连接':'待连接'}`}).catch(()=>{document.getElementById('health').textContent='后端尚未部署。'});
      loadActivities();
    })();
  </script>
</body>
</html>
