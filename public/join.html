<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>加入福音教会小组</title>
  <style>
    :root{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:#172025;background:#f5f8fa}
    *{box-sizing:border-box}body{margin:0}.shell{width:min(560px,calc(100% - 28px));margin:0 auto;padding:28px 0 60px}
    .card{background:white;border:1px solid #dce5ea;border-radius:20px;padding:20px;box-shadow:0 10px 35px rgba(28,55,70,.08);margin-bottom:16px}
    h1{font-size:26px;margin:0 0 8px}.muted{color:#66737b;line-height:1.55}.group{font-size:22px;font-weight:800;color:#087fae}
    label{display:grid;gap:6px;margin:14px 0;font-weight:700}input{font:inherit;padding:13px;border:1px solid #cad6dc;border-radius:12px}
    button{width:100%;border:0;border-radius:12px;padding:14px;background:#087fae;color:white;font:inherit;font-weight:800}
    button:disabled{opacity:.55}.msg{margin-top:14px;line-height:1.5}.ok{color:#1d7649}.err{color:#9b3c38}
  </style>
</head>
<body>
<main class="shell">
  <section class="card">
    <h1>加入小组</h1>
    <p class="muted" id="intro">正在读取邀请信息…</p>
    <div class="group" id="groupName"></div>
    <p class="muted" id="groupMeta"></p>
  </section>
  <form class="card" id="joinForm" hidden>
    <label>姓名<input name="display_name" autocomplete="name" required></label>
    <label>手机号<input name="phone" type="tel" autocomplete="tel" required></label>
    <label>居住地邮编<input name="postcode" autocomplete="postal-code" placeholder="例如 2511 EC" required></label>
    <button id="submitButton" type="submit">申请加入这个小组</button>
    <div class="msg" id="message"></div>
  </form>
</main>
<script>
const inviteToken=new URLSearchParams(location.search).get('token')||'';
let group=null;
const intro=document.getElementById('intro'),groupName=document.getElementById('groupName'),groupMeta=document.getElementById('groupMeta');
const form=document.getElementById('joinForm'),message=document.getElementById('message'),button=document.getElementById('submitButton');
(async()=>{
  try{
    if(!inviteToken)throw new Error('邀请链接无效');
    const response=await fetch('/api/app/join-invite/'+encodeURIComponent(inviteToken),{headers:{accept:'application/json'}});
    const data=await response.json();
    if(!response.ok)throw new Error(data.error||'邀请链接已失效');
    group=data.group;
    groupName.textContent=(group.group_number?group.group_number+'｜':'')+group.name;
    const bits=[group.cluster_name,group.meeting_day,group.meeting_time,group.meeting_frequency,group.postcode].filter(Boolean);
    groupMeta.textContent=bits.join(' · ');
    intro.textContent='填写下面三项资料后，申请会发送给这个小组的组长审核。';
    form.hidden=false;
  }catch(error){
    intro.textContent=error.message||'邀请链接暂时无法使用';
  }
})();
form.addEventListener('submit',async event=>{
  event.preventDefault();
  if(!group)return;
  button.disabled=true;message.textContent='正在提交…';message.className='msg';
  const fd=new FormData(form);
  try{
    const response=await fetch('/api/app/register',{method:'POST',headers:{'content-type':'application/json','accept':'application/json'},body:JSON.stringify({
      display_name:String(fd.get('display_name')||'').trim(),
      phone:String(fd.get('phone')||'').trim(),
      postcode:String(fd.get('postcode')||'').trim(),
      requested_group_id:group.id
    })});
    const data=await response.json();
    if(!response.ok&&response.status!==202)throw new Error(data.error||'提交失败');
    message.textContent=data.message||'申请已提交，等待小组长审核。';
    message.className='msg ok';
    form.querySelectorAll('input').forEach(input=>input.disabled=true);
    button.textContent='申请已提交';
  }catch(error){
    button.disabled=false;
    message.textContent=error.message||'提交失败，请稍后再试。';
    message.className='msg err';
  }
});
</script>
</body>
</html>
