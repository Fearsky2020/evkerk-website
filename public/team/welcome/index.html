<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>新人接待与牧养 · EVKERK</title>
  <link rel="stylesheet" href="/team/styles.css?v=2">
  <link rel="stylesheet" href="/team/welcome/welcome.css?v=3">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/team/"><img src="/assets/evkerk-logo.webp" alt="EVKERK"><span>新人接待与牧养</span></a>
    <a class="back-link" href="/team/">← 同工入口</a>
  </header>

  <main class="welcome-shell">
    <section class="welcome-hero">
      <div>
        <p class="eyebrow">WELCOME & PASTORAL CARE</p>
        <h1>让每一个新人都有人接住</h1>
        <p>先看距离，再看小组画像，最后由同工决定。分配之后继续记录谁在牧养、联系到哪一步、结果怎么样。</p>
      </div>
      <div class="stats-grid" id="statsGrid"></div>
    </section>

    <nav class="welcome-tabs" aria-label="新人接待功能">
      <button class="active" data-tab="intake">新人推荐</button>
      <button data-tab="cases">跟进名单</button>
      <button data-tab="groups">小组资料</button>
    </nav>

    <section class="tab-panel active" id="tab-intake">
      <div class="two-col">
        <form class="panel" id="intakeForm">
          <div class="panel-head"><div><p class="eyebrow">第一步</p><h2>输入新人情况</h2></div><span class="privacy-pill">只需邮编</span></div>
          <label>姓名 / 称呼<input name="display_name" placeholder="例如：张弟兄（可稍后补）"></label>
          <label>邮编<input name="postcode" placeholder="例如 2511 BT" autocomplete="postal-code" required></label>
          <label>联系方式备注<input name="contact_note" placeholder="例如：微信已加 / 电话由接待组保存"></label>
          <div class="form-grid">
            <label>接待地点<select name="reception_site"><option value="">未确认</option><option value="海牙教会">海牙教会（表格圈内“海”）</option><option value="主特美教会">主特美教会（表格圈内“主”）</option></select></label>
            <label>跟谁来的 / 谁邀请的<input name="invited_by" placeholder="例如：张姐妹 / 自己来的"></label>
            <label>是否基督徒<select name="faith_status"><option value="">未确认</option><option value="基督徒">是基督徒</option><option value="非基督徒">不是基督徒</option></select></label>
          </div>
          <div class="form-grid">
            <label>年龄阶段<select name="age_band"><option value="">未填写</option><option>20–29</option><option>30–39</option><option>40–49</option><option>50–59</option><option>60+</option></select></label>
            <label>家庭情况<select name="family_status"><option value="">未填写</option><option>单身</option><option>夫妻</option><option>家庭</option></select></label>
            <label>孩子情况<select name="children_note"><option value="">未填写</option><option>有孩子</option><option>没有孩子</option></select></label>
            <label>生活 / 职业阶段<select name="occupation_stage"><option value="">未填写</option><option>学生</option><option>职场</option><option>家庭</option><option>退休</option></select></label>
            <label>方便聚会时间<select name="preferred_days"><option value="">都可以</option><option>周一</option><option>周二</option><option>周三</option><option>周四</option><option>周五</option><option>周六</option><option>周日</option></select></label>
            <label>语言<select name="language_note"><option value="">未填写</option><option>中文</option><option>中英双语</option><option>荷兰语</option></select></label>
          </div>
          <label>背景 / 特别情况<textarea name="background_note" rows="3" placeholder="只写分组和牧养真正需要知道的内容"></textarea></label>
          <button class="primary wide" type="submit">推荐合适的小组</button>
          <p class="message" id="intakeMessage"></p>
        </form>

        <div class="panel results-panel">
          <div class="panel-head"><div><p class="eyebrow">第二步</p><h2>推荐结果</h2></div></div>
          <div id="recommendationEmpty" class="empty-state">输入新人邮编后，这里会显示综合推荐的小组。</div>
          <div id="recommendationList" class="recommendation-list"></div>
        </div>
      </div>
    </section>

    <section class="tab-panel" id="tab-cases">
      <div class="panel">
        <div class="panel-head"><div><p class="eyebrow">持续跟进</p><h2>新人牧养名单</h2></div><button class="secondary" id="refreshCases" type="button">刷新</button></div>
        <div id="caseList" class="case-list"></div>
      </div>
    </section>

    <section class="tab-panel" id="tab-groups">
      <div class="panel">
        <div class="panel-head"><div><p class="eyebrow">小组画像</p><h2>目前的小组资料</h2></div><span class="privacy-pill">33 个真实小组</span></div>
        <p class="muted">小组名册已经按四个大组录入。邮编、聚会时间和小组画像会随着资料收集逐步补齐。</p>
        <details class="group-editor">
          <summary>补充或修改小组资料</summary>
          <form id="groupForm">
            <input type="hidden" name="id">
            <div class="form-grid">
              <label>小组编号<input name="group_number" type="number" min="1" max="999" required></label>
              <label>小组名称<input name="name" required></label>
              <label>所属大组<select name="cluster_name" required><option>第一大组</option><option>第二大组</option><option>第三大组</option><option>第四大组</option></select></label>
              <label>大组长<input name="cluster_leader_name"></label>
              <label>小组长<input name="leader_name" required></label>
              <label>副组长<input name="deputy_leader_name"></label>
              <label>聚会邮编<input name="postcode" placeholder="例如 2511 BT" required></label>
              <label>聚会星期<select name="meeting_day"><option value="">待补</option><option>周一</option><option>周二</option><option>周三</option><option>周四</option><option>周五</option><option>周六</option><option>周日</option></select></label>
              <label>聚会时间<input name="meeting_time" type="time"></label>
              <label>聚会频率<input name="meeting_frequency" placeholder="例如：每周 / 第一、三周"></label>
              <label>晚餐<select name="dinner"><option value="unknown">待补</option><option value="always">每次有晚餐</option><option value="often">经常有晚餐</option><option value="sometimes">偶尔有晚餐</option><option value="no">没有晚餐</option></select></label>
              <label>当前人数<input name="current_size" type="number" min="0"></label>
              <label>建议人数上限<input name="capacity_max" type="number" min="1"></label>
              <label>接收新人<select name="accepting_newcomers"><option value="1">可以接收</option><option value="0">暂停接收</option></select></label>
              <label>地址可见范围<select name="address_visibility"><option value="assigned">分配确认后提供</option><option value="internal">仅内部同工可见</option><option value="public">允许公开</option></select></label>
            </div>
            <div class="form-grid">
              <label>常用语言<input name="language_profile" placeholder="例如：普通话为主，可英语"></label>
              <label>适合人群<input name="audience_profile" placeholder="例如：家庭、青年、初信者"></label>
              <label>儿童情况<input name="children_profile" placeholder="例如：欢迎带孩子，有儿童活动"></label>
              <label>无障碍 / 交通<input name="accessibility_note" placeholder="例如：有电梯、停车方便"></label>
              <label>容量说明<input name="capacity_note" placeholder="例如：目前可接收一家人"></label>
              <label>联系规则<input name="contact_mode" placeholder="例如：先联系组长确认"></label>
              <label>微信资料备注<input name="wechat_note" placeholder="例如：名片已收，由接待同工转发"></label>
              <label>节假日 / 临时安排<input name="schedule_note" placeholder="例如：学校假期暂停"></label>
            </div>
            <div class="actions"><button class="primary" type="submit">保存小组资料</button><button class="secondary" id="cancelGroupEdit" type="button">清空</button></div>
            <p class="message" id="groupMessage"></p>
          </form>
        </details>
        <div id="groupList" class="group-grid"></div>
      </div>
    </section>
  </main>

  <dialog id="caseDialog"><div class="dialog-card welcome-dialog"><button class="close" data-close>×</button><div id="caseDialogBody"></div></div></dialog>
  <script src="/team/welcome/app.js?v=3"></script>
</body>
</html>
