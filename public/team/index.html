<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>EVKERK 主日学同工</title>
  <link rel="stylesheet" href="/team/styles.css?v=2">
</head>
<body>
  <div class="login-wrap" id="loginView">
    <form class="login-card" id="loginForm" autocomplete="off">
      <a class="brand" href="/"><img src="/assets/evkerk-logo.webp" alt="EVKERK"><span>EVKERK</span></a>
      <p class="eyebrow">主日学同工入口</p>
      <h1>欢迎回来</h1>
      <p class="muted">看课表、备课、记录到场，并把课堂情况留给整个老师团队。</p>
      <label>姓名或邮箱<input id="identifier" autocomplete="off" autocapitalize="none" spellcheck="false" required></label>
      <label>个人访问密钥<input id="token" type="text" class="masked-secret" autocomplete="off" autocapitalize="none" spellcheck="false" required></label>
      <button class="primary wide" type="submit">进入主日学</button>
      <p class="message" id="loginMessage"></p>
      <a class="back" href="/">← 返回教会网站</a>
    </form>
  </div>

  <div class="app" id="appView" hidden>
    <header class="topbar">
      <a class="brand" href="/"><img src="/assets/evkerk-logo.webp" alt="EVKERK"><span>主日学同工</span></a>
      <div class="who"><span id="whoName"></span><button class="text-btn" id="logoutBtn">退出</button></div>
    </header>

    <main class="shell">
      <nav class="nav" id="nav">
        <button class="active" data-view="home">首页</button>
        <button data-view="schedule">课表</button>
        <button data-view="lessons">课程</button>
        <button data-view="attendance">到场</button>
        <button data-view="records">教学记录</button>
        <button data-view="manage" id="manageTab" hidden>管理</button>
      </nav>

      <section class="view active" id="view-home">
        <div class="page-head"><p class="eyebrow">今天先看这里</p><h1>老师工作台</h1></div>
        <div id="nextLesson"></div>
        <div class="section-head"><h2>最近教学记录</h2><button class="link-btn" data-go="records">全部记录</button></div>
        <div class="stack" id="recentRecords"></div>
      </section>

      <section class="view" id="view-schedule">
        <div class="page-head"><p class="eyebrow">谁来教 · 教什么</p><h1>老师课表</h1></div>
        <div class="stack" id="scheduleList"></div>
      </section>

      <section class="view" id="view-lessons">
        <div class="page-head"><p class="eyebrow">共同教材</p><h1>课程内容</h1></div>
        <div class="lesson-grid" id="lessonList"></div>
      </section>

      <section class="view" id="view-attendance">
        <div class="page-head"><p class="eyebrow">点一下就完成</p><h1>学生到场</h1></div>
        <label class="select-label">选择一堂课<select id="attendanceSchedule"></select></label>
        <div class="card" id="attendanceCard"><p class="muted">先选择一堂课。</p></div>
      </section>

      <section class="view" id="view-records">
        <div class="page-head"><p class="eyebrow">所有老师都能看到</p><h1>教学记录</h1></div>
        <div class="stack" id="recordList"></div>
      </section>

      <section class="view" id="view-manage">
        <div class="page-head"><p class="eyebrow">只给负责人</p><h1>主日学管理</h1></div>
        <div class="manage-grid">
          <form class="card" id="lessonForm"><h2>添加课程</h2><label>课程标题<input name="title" required placeholder="例如：民数记 9–12章"></label><label>经文<input name="scripture" placeholder="民数记 9–12章"></label><label>课程内容<textarea name="content" rows="10" required></textarea></label><button class="primary" type="submit">保存课程</button><p class="message"></p></form>
          <form class="card" id="scheduleForm"><h2>安排老师</h2><label>日期<input name="lesson_date" type="date" required></label><label>老师<select name="teacher_id" id="manageTeacherSelect"></select></label><label>课程<select name="lesson_id" id="manageLessonSelect"></select></label><label>补充说明<input name="note"></label><button class="primary" type="submit">加入课表</button><p class="message"></p></form>
          <form class="card" id="studentForm"><h2>添加学生</h2><label>姓名<input name="name" required></label><button class="primary" type="submit">添加学生</button><p class="message"></p></form>
          <form class="card" id="teacherForm"><h2>添加老师账号</h2><label>姓名<input name="name" required></label><label>邮箱（选填）<input name="email" type="email"></label><button class="primary" type="submit">创建老师账号</button><p class="message"></p><div class="key-box" id="newTeacherKey" hidden></div></form>
        </div>
      </section>
    </main>
  </div>

  <dialog id="lessonDialog"><div class="dialog-card"><button class="close" data-close>×</button><p class="eyebrow" id="dialogScripture"></p><h1 id="dialogTitle"></h1><div class="lesson-content" id="dialogContent"></div></div></dialog>

  <dialog id="classDialog"><div class="dialog-card"><button class="close" data-close>×</button><p class="eyebrow" id="classDate"></p><h1 id="classTitle"></h1><p class="muted" id="classTeacher"></p><div class="actions"><button class="secondary" id="openLessonBtn">查看课程</button></div><div id="teacherNoteBlock"><h2>我的授课笔记</h2><textarea id="teacherNote" rows="7" placeholder="这里是你自己的备课笔记，其他老师看不到。"></textarea><button class="primary" id="saveNoteBtn">保存笔记</button><p class="message" id="noteMessage"></p></div><hr><h2>课后教学记录</h2><p class="muted">这部分提交后，所有主日学老师都能看到。</p><label>今天讲到哪里<textarea id="recordProgress" rows="3"></textarea></label><label>学生整体反应<textarea id="recordResponse" rows="3"></textarea></label><label>需要后面继续 / 复习<textarea id="recordFollow" rows="3"></textarea></label><label>其他备注<textarea id="recordNotes" rows="3"></textarea></label><button class="primary" id="saveRecordBtn">保存教学记录</button><p class="message" id="recordMessage"></p></div></dialog>

  <script src="/team/app.js?v=1"></script>
</body>
</html>
