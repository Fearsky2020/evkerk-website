<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>EVKERK 同工入口</title>
  <link rel="stylesheet" href="/team/styles.css?v=3">
  <link rel="stylesheet" href="/team/portal.css?v=1">
</head>
<body>
  <div class="login-wrap" id="loginView">
    <form class="login-card" id="loginForm" autocomplete="off">
      <a class="brand" href="/"><img src="/assets/evkerk-logo.webp" alt="EVKERK"><span>EVKERK</span></a>
      <p class="eyebrow">同工入口</p>
      <h1>欢迎回来</h1>
      <p class="muted">使用负责人给你的同工账号和登录码。登录后只会看到这个账号已经开通的服事。</p>
      <label>姓名或邮箱<input id="identifier" autocomplete="username" autocapitalize="none" spellcheck="false" required></label>
      <label>登录码<input id="password" type="password" autocomplete="current-password" placeholder="输入负责人给你的登录码" required></label>
      <button class="primary wide" type="submit">进入同工后台</button>
      <p class="muted">忘记登录码请联系教会负责人重新生成。</p>
      <p class="message" id="loginMessage"></p>
      <a class="back" href="/">← 返回教会网站</a>
    </form>
  </div>

  <div class="app" id="appView" hidden>
    <header class="topbar">
      <a class="brand" href="/"><img src="/assets/evkerk-logo.webp" alt="EVKERK"><span>同工入口</span></a>
      <div class="who"><span id="whoName"></span><button class="text-btn" id="logoutBtn">退出</button></div>
    </header>

    <main class="portal-shell">
      <div class="portal-head">
        <div>
          <p class="eyebrow">TEAM PORTAL</p>
          <h1>今天要服事什么？</h1>
          <p>从这里进入你的服事工作。主日学只是其中一个模块，活动、照片、讲道和其它服事会逐步统一到这里。</p>
        </div>
      </div>
      <div class="service-grid" id="serviceGrid"></div>
      <p class="portal-note">如果你看不到自己负责的服事，请联系教会负责人调整账号权限。</p>
    </main>
  </div>

  <script src="/team/portal.js?v=6"></script>
</body>
</html>
