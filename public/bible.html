<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f6f2ea">
  <title>在线圣经 | 基督教福音教会 Evangeliekerk</title>
  <meta name="description" content="基督教福音教会在线圣经：和合本圣经、书卷章节切换、字号调整、经文选择与读经打卡。">
  <link rel="canonical" href="https://evkerk.nl/bible">
  <link rel="icon" href="/assets/evkerk-logo.webp" type="image/webp">
  <link rel="stylesheet" href="/styles.css?v=2">
  <link rel="stylesheet" href="/brand.css?v=32">
  <link rel="stylesheet" href="/bible.css?v=10">
</head>
<body class="bible-page">
  <header class="site-header bible-site-header">
    <a class="brand" href="/"><img class="brand-mark" src="/assets/evkerk-logo.webp" alt="" width="40" height="40"><span class="brand-copy"><strong>基督教福音教会</strong><small>EVANGELIEKERK</small></span></a>
    <div class="bible-header-actions"><button class="round-btn" id="themeToggle" type="button" aria-label="切换明暗模式">☾</button><a class="bible-home-link" href="/">返回首页</a></div>
  </header>
  <main class="bible-shell">
    <section class="daily-verse-strip" id="dailyVerseCard">
      <div><span class="daily-label">今日经文</span><small id="dailyVerseRef">正在载入</small><p id="dailyVerseText">愿神的话成为今天脚前的灯。</p></div>
      <button id="openDailyVerse" type="button">打开</button>
    </section>
    <section class="bible-toolbar" aria-label="圣经工具">
      <button id="passageButton" class="passage-button" type="button"><span id="passageLabel">罗马书 8</span><small>切换书卷与章节</small></button>
      <div class="reading-mode-switch"><button class="active" type="button" data-mode="paper">纸质</button><button type="button" data-mode="verse">分节</button></div>
      <button id="searchButton" class="font-button search-button" type="button" aria-label="搜索圣经" title="搜索圣经"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"></circle><path d="M15.5 15.5 21 21"></path></svg></button><button id="audioButton" class="audio-button" type="button" aria-label="有声圣经：朗读本章" title="有声圣经：朗读本章"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 9h4l5-4v14l-5-4H5z"></path><path d="M17 9.5c1.2 1.3 1.2 3.7 0 5"></path><path d="M19.5 7c2.5 2.8 2.5 7.2 0 10"></path></svg><span>听</span></button><button id="fontButton" class="font-button" type="button">Aa</button><span class="version-chip">和合本</span>
    </section>
    <article class="paper-bible" id="paperBible">
      <header class="paper-heading"><button id="prevChapter" type="button" aria-label="上一章">‹</button><div><small>和合本</small><h2 id="chapterTitle">罗马书 第8章</h2></div><button id="nextChapter" type="button" aria-label="下一章">›</button></header>
      <div id="verseFlow" class="verse-flow"><p class="loading-copy">正在打开圣经…</p></div>
      <p id="offlineNote" class="offline-note" hidden>当前显示的是最近缓存的经文。</p>
    </article>
    <section class="reading-checkin">
      <button id="readingCheckin" type="button">✓ 今日读完打卡</button>
      <small id="readingStreak">今天还没有打卡</small>
    </section>
    <section class="related-card">
      <div class="related-heading"><div><p class="eyebrow">RELATED MESSAGES</p><h2>相关讲道</h2></div><span id="relatedCount">0</span></div>
      <p>如果网站里有标注这章经文的讲道，会自动出现在这里。</p>
      <div id="relatedList" class="related-list"></div>
    </section>
  </main>
  <div id="selectionBar" class="selection-bar" hidden><div><strong id="selectionRef">已选经文</strong><small id="selectionCount">0 节</small></div><div><button id="copySelection" type="button">复制 ▾</button><button id="clearSelection" type="button">取消</button></div></div>
  <dialog id="passageDialog" class="bible-dialog passage-dialog"><form method="dialog"><header><strong>选择经文</strong><button value="cancel">×</button></header><input id="bookSearch" type="search" placeholder="搜索书卷，例如：约翰"><div class="picker-label">书卷</div><div id="bookPicker" class="book-picker"></div><div class="picker-label">章节</div><div id="chapterPicker" class="chapter-picker"></div></form></dialog>
  <dialog id="fontDialog" class="bible-dialog"><form method="dialog"><header><strong>经文字号</strong><button value="cancel">×</button></header><p>只调整圣经正文。</p><div class="font-options"><button type="button" data-font="small">小</button><button type="button" data-font="normal">标准</button><button type="button" data-font="large">大</button><button type="button" data-font="xlarge">特大</button></div></form></dialog>
  <dialog id="copyDialog" class="bible-dialog copy-dialog"><form method="dialog"><header><strong>复制经文</strong><button value="cancel">×</button></header><p>经文出处会保留在第一行，选择正文格式：</p><div class="copy-options"><button id="copyWithVerseNumbers" type="button"><strong>带节号</strong><small>每节保留 22、23、24，并逐节换行</small></button><button id="copyPlainText" type="button"><strong>不带节号</strong><small>去掉节号，合并成一段连续经文</small></button></div></form></dialog>
  <dialog id="searchDialog" class="bible-dialog search-dialog"><form method="dialog"><header><strong>搜索圣经</strong><button value="cancel">×</button></header><input id="bibleSearchInput" type="search" placeholder="搜书名或经文，例如：约翰、不要惧怕、爱"><p class="search-help">输入书名可直接打开书卷；输入关键词会搜索整本和合本。</p><div id="bibleSearchResults" class="bible-search-results"><div class="related-empty">输入关键词开始搜索。</div></div></form></dialog>
  <div id="toast" class="bible-toast" role="status" aria-live="polite"></div>
  <footer class="site-footer shell bible-footer"><div class="footer-brand"><img src="/assets/evkerk-logo.webp" alt="" width="34" height="34"><span><strong>基督教福音教会</strong><small>EVANGELIEKERK</small></span></div><div class="footer-links"><a href="/">首页</a><a href="/sermons">讲道</a><a href="/bible">圣经</a></div></footer>
  <script src="/bible.js?v=4"></script>
</body>
</html>
